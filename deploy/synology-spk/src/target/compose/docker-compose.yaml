# Compose-Datei des ComfoBox-Gateways (DSM 7 / Docker-Project-Worker).
#
# **Der Dateiname ist PFLICHT: `docker-compose.yaml`.**
# Der Worker "docker-project" hat eine fest verdrahtete Namensliste - im
# Binary `libdockerprojectgeneratorworker.so` stehen genau drei Namen:
#
#     docker-compose.yaml
#     docker-compose.yml
#     docker-compose.admin.yaml
#
# `compose.yaml` ist NICHT dabei, obwohl Docker Compose v2 ihn selbst
# erkennt. Mit `compose.yaml` findet der Worker die Datei nicht, bricht ab,
# **bevor** er Docker anfasst (kein Volume, kein Container, keine Logzeile)
# und meldet nur:
#
#     project build fail: [`2201`] `fail compose up '<uuid>'`
#
# Das war die Ursache der gescheiterten Installationen bis Revision 0011.
#
# Diese Datei liegt unter target/compose/ und wird vom DSM-Worker
# "docker-project" verwaltet (conf/resource). Der Worker legt daraus das
# Projekt an und startet bzw. stoppt es beim Start/Stopp des Pakets -
# als Root. Das Paket selbst braucht dadurch KEINE Root-Rechte; auf DSM 7
# werden Drittanbieter-Paketen mit "run-as": "root" abgelehnt (Fehler 319).
#
# Die Datei ist bewusst STATISCH:
#
#   * Der Serial-Port steht hier NICHT. Der Container sieht alle seriellen
#     Ports des NAS (/dev ist eingebunden) und der Gateway waehlt den Port
#     zur Laufzeit aus der config.json aus. Dadurch muss der Container nach
#     der Auswahl im Assistenten nicht neu erstellt werden.
#   * Baudrate und Port stehen in der config.json (Vorrang vor Env).
#
# Soll statt "/dev" ein einzelner fester Port verwendet werden, wird die
# Zeile "devices:" mit "- /dev/ttyUSB0:/dev/ttyUSB0" eingetragen und der
# Eintrag "/dev:/dev" entfernt.
# Das Feld "version" ist bei Docker Compose v2 ueberholt (dort erscheint eine
# Warnung), bei Compose v1 < 1.27 ist es aber PFLICHT - ohne das Feld lehnt
# der Parser die Dateien ab. Die Angabe ist damit in beiden Welten sicher.
version: "3.8"

services:
  gateway:
    image: @IMAGE@
    container_name: comfobox-gateway
    restart: unless-stopped

    ports:
      - "8081:8080/tcp"

    # Die Gruppe "dialout" wird auf dem Host aufgeloest - so bekommt der
    # Container (uid 1001) Zugriff auf /dev/ttyUSB* ohne Root.
    #
    # **Numerische GID statt Gruppename:** Auf DSM hat "dialout" ueblicher-
    # weise die GID 20. Ein *Name* wuerde aber die Container-Erstellung
    # abbrechen, wenn die Gruppe auf dem NAS anders heisst oder fehlt
    # ("unable to find group dialout") - damit waere auch die Installation
    # des Pakets gescheitert. Die numerische GID ist robust.
    group_add:
      - "20"

    environment:
      # Das Datenverzeichnis und der 24-h-Schreibzaehler (EEPROM-Schutz)
      # liegen im Volume "comfobox-data" - siehe unten.
      - COMFOBOX_Gateway__DataDirectory=/var/lib/comfobox
      # Der Port und die Baudrate kommen aus der config.json und haben dort
      # Vorrang. Der Wert hier ist nur der Startwert.
      - COMFOBOX_BACNET__Baudrate=38400
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_gcServer=1
      # Das Log-Verzeichnis liegt bewusst IM Datenverzeichnis. Damit
      # braucht es nur EINEN Mount (siehe unten) - zwei Mounts, deren
      # Host-Pfade ineinander liegen, sind eine Fehlerquelle.
      - COMFOBOX_Logging__Directory=/var/lib/comfobox/logs

    volumes:
      # ---------------------------------------------------------------------
      # Das persistente Volume - **kein** Bind-Mount auf einen Pfad unter
      # /var/packages!
      #
      # Warum: Das DSM loescht bei jeder Installation /var/packages/<paket>
      # und legt es neu an. Legt Docker einen **fehlenden** Bind-Mount-
      # Quellpfad an, gehoert er danach **root:root** (Modus 0755). Der
      # Container laeuft aber als uid 1001 (comfobox) und kann dann weder
      # die config.json schreiben noch den 24-h-Schreibzaehler sichern -
      # Serilog bricht den Start ab, der Container stirbt sofort wieder und
      # der DSM-Worker meldet nur "fail compose up".
      #
      # Ein **benanntes Volume** loest das: Docker uebernimmt Inhalt UND
      # Rechte aus dem Image (/var/lib/comfobox gehoert uid 1001) - der
      # Container kann dort immer schreiben.
      #
      # Der Name ist fest ("comfobox-data"), damit das Backup-Skript
      # (deploy/backup/backup.sh) das Volume ohne Kenntnis des
      # Projektnamens findet - genau wie beim manuellen Betrieb.
      # ---------------------------------------------------------------------
      - comfobox-data:/var/lib/comfobox
      # Alle seriellen Ports (CH340/FTDI). Der Gateway waehlt aus, welcher
      # Port benutzt wird - der Container muss deshalb nicht neu erstellt
      # werden, wenn der Adapter spaeter gesteckt wird.
      - "/dev:/dev"

    healthcheck:
      # curl ist im Image vorhanden (siehe Dockerfile). busybox-wget
      # liefert unter manchen BusyBox-Versionen keinen sauberen Exit-Code.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

volumes:
  comfobox-data:
    # Fester Name - unabhaengig vom Projektnamen. Das Backup-Skript sucht
    # genau diesen Namen.
    name: comfobox-data
