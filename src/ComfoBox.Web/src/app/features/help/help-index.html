<section class="cb-help">
  <h1 class="cb-page-title">{{ t().help.title }}</h1>

  <p class="cb-lead">
    {{ t().help.lead }}
  </p>

  <span class="cb-search">
    <i class="pi pi-search" aria-hidden="true"></i>
    <input
      pInputText
      type="search"
      [ngModel]="term()"
      (ngModelChange)="term.set($event)"
      [placeholder]="t().help.search"
      [attr.aria-label]="t().help.searchAria"
    />
  </span>

  @if (help.error(); as error) {
    <p-message severity="error" styleClass="w-full">
      <p>{{ error }}</p>
    </p-message>
  }

  <div class="cb-help-grid">
    @for (entry of results(); track entry.slug) {
      <p-card>
        <a class="cb-help-link" [routerLink]="['/help', entry.slug]">
          <span class="cb-help-title">{{ entry.title }}</span>
          <span class="cb-help-description">{{ entry.description }}</span>
        </a>

        @if (entry.tags.length > 0) {
          <div class="cb-help-tags">
            @for (tag of entry.tags; track tag) {
              <p-tag [value]="tag" severity="secondary" />
            }
          </div>
        }
      </p-card>
    } @empty {
      <p-message severity="info" styleClass="w-full">
        <p>{{ t().help.empty }}</p>
      </p-message>
    }
  </div>
</section>
