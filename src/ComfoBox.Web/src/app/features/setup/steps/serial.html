<p-card [header]="t().setupSteps.serialCard">
  <p-message severity="info" styleClass="w-full cb-block">
    <p class="font-semibold">{{ t().setupSteps.serialHintTitle }}</p>
    <p>
      {{ t().setupSteps.serialHintText }}
    </p>
  </p-message>

  <!--
    Die Meldung wird **nicht** per @if entfernt: Optimus UI lässt eine
    entfernte p-message per Leave-Animation im DOM stehen - und in einem
    Hintergrund-Tab feuert das animationend-Event nie. Die Meldung wäre
    dann dauerhaft sichtbar, obwohl ports gefunden wurden.
  -->
  <p-message
    [severity]="setup.ports().length === 0 ? 'warn' : 'info'"
    styleClass="w-full cb-block"
  >
    @if (setup.ports().length === 0) {
      <p>{{ t().setupSteps.serialNone }}</p>
      <p>
        <a routerLink="/help/anschluss" fragment="adapter-erkennen">
          {{ t().setupSteps.serialHelpLink }}
        </a>
      </p>
    } @else {
      <p>{{ t().setupSteps.serialChoose }}</p>
    }
  </p-message>

  <p-button
    [label]="t().setupSteps.serialRescan"
    icon="pi pi-refresh"
    [loading]="setup.loadingPorts()"
    (onClick)="setup.reloadPorts()"
  />

  <div class="cb-ports" role="radiogroup" [attr.aria-label]="t().serial.portsAria">
    @for (port of setup.ports(); track port.port) {
      <div class="cb-port" [class.cb-port-selected]="setup.selectedPort() === port.port">
        <p-radiobutton
          name="serial"
          [value]="port.port"
          [ngModel]="setup.selectedPort()"
          (ngModelChange)="setup.selectedPort.set($event)"
          [inputId]="'port-' + port.port"
          [ariaLabelledBy]="'port-label-' + port.port"
        />

        <label class="cb-port-body" [for]="'port-' + port.port">
          <span class="cb-port-description" [id]="'port-label-' + port.port">
            {{ port.description ?? port.port }}
          </span>
          <code class="cb-port-path">{{ port.port }}</code>
          @if (port.stablePath) {
            <span class="cb-port-stable">{{ t().setupSteps.serialStable(port.stablePath) }}</span>
          }
        </label>
      </div>
    }
  </div>

  <div class="cb-switch-row">
    <p-toggleswitch
      inputId="pass-all"
      [ngModel]="setup.passAllDevices()"
      (ngModelChange)="setup.passAllDevices.set($event)"
    />
    <label for="pass-all">
      {{ t().setupSteps.serialPassAll }}
    </label>
  </div>
</p-card>
