<div class="cb-login">
  <p-card [header]="t().login.title">
    <p class="cb-hint">
      {{ t().login.hint }}
    </p>

    @if (error(); as message) {
      <p-message severity="error" styleClass="w-full cb-block">
        <p>{{ message }}</p>
      </p-message>
    }

    <form (ngSubmit)="login()">
      <div class="cb-field">
        <label for="login-user">{{ t().login.username }}</label>
        <input
          pInputText
          id="login-user"
          name="username"
          [ngModel]="userName()"
          (ngModelChange)="userName.set($event)"
          autocomplete="username"
          required
        />
      </div>

      <div class="cb-field">
        <label for="login-password">{{ t().login.password }}</label>
        <p-password
          inputId="login-password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
        />
      </div>

      <p-button
        type="submit"
        [label]="t().login.submit"
        icon="pi pi-sign-in"
        [loading]="busy()"
        [disabled]="!userName().trim() || !password()"
      />
    </form>

    <p class="cb-hint cb-block">
      <a routerLink="/help">{{ t().login.helpLink }}</a>
    </p>

    <div class="cb-login-language">
      <p-select
        [options]="languages"
        optionLabel="label"
        optionValue="code"
        [ngModel]="i18n.language()"
        (ngModelChange)="setLanguage($event)"
        [ariaLabel]="t().language.label"
      />
    </div>
  </p-card>
</div>
