[pytest]
# Nur die Tests der Home-Assistant-Integration.
testpaths = custom_components/comfobox/tests

# Kein Recursing in Legacy-, Doku- oder Deployment-Ordner.
norecursedirs = .git .github deploy docs node_modules src src_old tools

# HA-Tests: alle `async def`-Tests werden automatisch als asyncio-Tests
# behandelt (Home-Assistant-Empfehlung fuer Custom Components).
asyncio_mode = auto

# pytest-asyncio >= 0.24: Loop-Scope explizit setzen, sonst Warnung und
# kuenftig geaenderte Default-Semantik.
asyncio_default_fixture_loop_scope = function

# HA setzt `asyncio_mode` ueber das Plugin; die Zeile oben ist der Default.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
