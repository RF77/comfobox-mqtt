[pytest]
# Eigene Konfiguration fuer das Vergleichstool - die Tests der
# Home-Assistant-Integration (pytest.ini im Repo-Root) bleiben unberuehrt.
testpaths = tests
asyncio_mode = strict

# Das HA-Plugin (pytest-homeassistant-custom-component) bringt
# pytest-socket mit - das blockiert jede Socket-Erstellung und der
# asyncio-Self-Pipe scheitert unter Windows. Das Tool braucht davon nichts.
addopts = -p no:homeassistant -p no:socket
