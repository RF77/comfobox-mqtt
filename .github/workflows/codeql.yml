name: codeql

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'src_old/**'
      - 'docs/Mono/**'
  pull_request:
    paths-ignore:
      - 'src_old/**'
      - 'docs/Mono/**'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

# ─────────────────────────────────────────────────────────────────────────────
# src_old/ ist ARCHIV (net452, C# 6) und wird nicht analysiert:
#   * Der Legacy-Code läuft nicht mehr (letzter Stand: 24.10.) und ist nur
#     noch Referenz für Protokollverhalten und Item-Metadaten.
#   * Der frühere CI-Job "legacy-check" wurde abgeschaltet.
# Der Scan läuft ausschließlich über den neuen .NET-10-Code in src/.
#
# WICHTIG: `paths-ignore` ist **kein** Top-Level-Schlüssel eines Workflows
# ("Unexpected value 'paths-ignore'" → GitHub lehnt die **ganze** Datei ab
# und es startet **kein einziger** Job). Es gehört **unter** `on:` – dort
# filtert es die Trigger. Dieselbe Liste steht zusätzlich in der
# CodeQL-Konfiguration unten, damit der Scan das Archiv auch inhaltlich
# überspringt.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Das Archiv wird nicht analysiert (siehe Kommentar oben).
          # "paths-ignore" ist KEIN Input des init-Actions - es gehört in
          # die CodeQL-Konfiguration.
          config: |
            name: "ComfoBox (ohne Archiv)"
            paths-ignore:
              - src_old
              - docs/Mono

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
