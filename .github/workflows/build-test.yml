name: build-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Im Verzeichnis src/ wird global.json gefunden -> SDK ist gepinnt.
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore ComfoBox.sln --locked-mode

      - name: Build
        run: dotnet build ComfoBox.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test ComfoBox.sln -c Release --no-build --nologo --collect:"XPlat Code Coverage"

      - name: Vulnerability scan (NuGet)
        run: |
          dotnet list ComfoBox.sln package --vulnerable --include-transitive --format json > vuln.json
          if grep -q '"vulnerabilities": *\[.\+\]' vuln.json; then
            echo "::error::Vulnerable NuGet packages found – see artifact"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dotnet
          path: '**/TestResults/**'
          retention-days: 14

  fixtures:
    name: Topic-Fixture ist deckungsgleich zum Item-Katalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fixture prüfen
        run: node tools/generate-topics/generate-topics.mjs --check

  web:
    name: Build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ComfoBox.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ComfoBox.Web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -- --configuration production

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-web
          path: src/ComfoBox.Web/dist
          retention-days: 7

  legacy-check:
    name: Legacy-Projekte (net452) sind Archiv und werden NICHT gebaut
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archiv prüfen (nur Doku, kein Build)
        run: |
          # src_old/ ist Archiv: nur Referenz, wird weder gebaut noch gepflegt.
          # Dieser Job stellt sicher, dass dort kein neues SDK-Projekt entsteht.
          set -e
          if find src_old -name 'global.json' -o -name 'Directory.Build.props' | grep -q .; then
            echo "::error::src_old/ ist Archiv – keine Build-Konfiguration dort erlaubt"
            exit 1
          fi
          echo "src_old/ ist sauber (keine Build-Konfiguration)."
