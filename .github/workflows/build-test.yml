name: build-test

on:
  push:
    # `main` ist der Zielbranch, `Upgrade` der Entwicklungsbranch. Ohne den
    # Entwicklungsbranch gibt es dort **keine** automatische CI – der Code
    # wird erst beim Zusammenführen geprüft.
    branches: [ main, Upgrade ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Im Verzeichnis src/ wird global.json gefunden -> SDK ist gepinnt.
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore ComfoBox.sln --locked-mode

      - name: Build
        run: dotnet build ComfoBox.sln -c Release --no-restore --nologo

      - name: Test
        shell: bash
        run: |
          # Ein nacktes "Process completed with exit code 1" sagt nichts aus.
          # Deshalb wird die Ausgabe gesichert, bei Fehlschlag werden die
          # fehlgeschlagenen Tests als **Annotation** ausgegeben (die stehen
          # direkt am Lauf) und das Log als Artefakt hochgeladen.
          set -uo pipefail
          dotnet test ComfoBox.sln -c Release --no-build --nologo \
            --collect:"XPlat Code Coverage" 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::error::Mindestens ein Test ist fehlgeschlagen - die Namen stehen unten."
            {
              echo "### Fehlgeschlagene Tests"
              echo '```text'
              grep -E '\[FAIL\]|^[[:space:]]+Failed ' /tmp/test.log | head -30 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -E '\[FAIL\]|^[[:space:]]+Failed ' /tmp/test.log | head -10 | while IFS= read -r line; do
              # Workflow-Kommandos: % und Zeilenumbrueche muessen escaped werden.
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error::${safe}"
            done
          fi

          exit "$status"

      - name: Testlog hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog
          path: /tmp/test.log
          retention-days: 14

      - name: Vulnerability scan (NuGet)
        run: |
          dotnet list ComfoBox.sln package --vulnerable --include-transitive --format json > vuln.json
          if grep -q '"vulnerabilities": *\[.\+\]' vuln.json; then
            echo "::error::Vulnerable NuGet packages found – see artifact"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dotnet
          path: '**/TestResults/**'
          retention-days: 14

  fixtures:
    name: Topic-Fixture ist deckungsgleich zum Item-Katalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fixture prüfen
        run: node tools/generate-topics/generate-topics.mjs --check

  web:
    name: Build (Angular)
    runs-on: ubuntu-latest
    # Kein `if: hashFiles(...)` auf Job-Ebene: `hashFiles` ist in einer
    # Job-Bedingung nicht erlaubt - GitHub lehnt dann die **ganze** Datei ab
    # ("Unrecognized function: 'hashFiles'") und startet **keinen** Job.
    # Das Angular-Projekt existiert seit Phase 5.1, der Job läuft also immer.
    defaults:
      run:
        working-directory: src/ComfoBox.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ComfoBox.Web/package-lock.json

      - name: Lock-Datei prüfen
        run: |
          # `npm ci` bricht mit einer wenig hilfreichen EUSAGE-Meldung ab,
          # wenn die Lock-Datei nicht zur package.json passt (der Root-Eintrag
          # enthält dann keine Abhängigkeiten). Hier steht die Ursache klar.
          node -e "
            const lock = require('./package-lock.json');
            const pkg = require('./package.json');
            const root = lock.packages[''] ?? {};
            const missing = ['dependencies', 'devDependencies'].filter(
              (key) => Object.keys(pkg[key] ?? {}).length > 0
                     && Object.keys(root[key] ?? {}).length === 0);
            if (missing.length > 0) {
              console.error('::error::Die package-lock.json passt nicht zur package.json (' + missing.join(', ') + '). Bitte \"npm install\" ausführen und die Lock-Datei committen.');
              process.exit(1);
            }
            console.log('Die Lock-Datei ist konsistent.');
          "

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -- --configuration production

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-web
          path: src/ComfoBox.Web/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Der frühere Job "legacy-check" (Prüfung von src_old/) ist deaktiviert:
  # src_old/ ist Archiv und wird weder gebaut noch analysiert. Er brachte
  # keinen Nutzen, dafür roten Status.
  #
  # Der Legacy-Code wird von der CI bewusst NICHT angefasst:
  #   * kein Build            → der Job legacy-check ist entfernt
  #   * kein Security-Scan    → codeql.yml ignoriert src_old/ (paths-ignore)
  #   * keine Coverage        → die Solution enthält nur src/
  # ─────────────────────────────────────────────────────────────────────────
  container:
    name: Container-Image (ein Image, Gateway + UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Der Kontext ist das Repository-Wurzelverzeichnis: das Image braucht
      # sowohl das .NET-Projekt als auch die Angular-Oberfläche (→ ADR-007).
      # Es wird nur für amd64 gebaut – die Multi-Arch-Variante entsteht im
      # docker-publish-Workflow.
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ComfoBox.Gateway/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: comfobox-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Image-Eigenschaften prüfen
        run: |
          set -e
          echo "--- Größe ---"
          docker images comfobox-gateway:ci --format '{{.Size}}'

          echo "--- Kein Root, tini als PID 1 ---"
          test "$(docker inspect comfobox-gateway:ci --format '{{.Config.User}}')" = "comfobox"
          test "$(docker inspect comfobox-gateway:ci --format '{{index .Config.Entrypoint 0}}')" = "/sbin/tini"

          echo "--- Die Angular-UI liegt im Image ---"
          docker run --rm --entrypoint sh comfobox-gateway:ci -c 'test -f /app/wwwroot/index.html'

      - name: Container starten und prüfen
        run: |
          set -e
          # Ohne Serial-Port: der CI-Läufer hat kein /dev/ttyUSB0.
          docker run -d --name comfobox-ci \
            -p 8081:8080 \
            -e COMFOBOX_Bacnet__Port=COM_TEST \
            comfobox-gateway:ci

          # Auf den **Docker-Health-Status** warten (max. 120 s).
          #
          # Wichtig: nicht nur auf den HTTP-Endpunkt warten. Der
          # Health-Status wird erst vom periodischen Healthcheck gesetzt
          # (Intervall 30 s, Startperiode 25 s) - wer sofort danach prüft,
          # sieht "starting" und der Job wird rot. Der Endpunkt antwortet
          # nach ~2 s, der Status steht erst nach ~30 s auf "healthy".
          STATUS="unknown"
          for i in $(seq 1 120); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' comfobox-ci 2>/dev/null || echo unknown)
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "::error::Der Container meldet 'unhealthy'."
              docker logs comfobox-ci
              exit 1
            fi
            sleep 1
          done
          echo "Health-Status: $STATUS"
          test "$STATUS" = "healthy"

          # Der Health-Endpoint muss antworten.
          curl -fsS http://localhost:8081/api/health > /tmp/health.json
          cat /tmp/health.json
          grep -q '"state"' /tmp/health.json

          # Die SPA wird aus dem .NET-Host ausgeliefert.
          curl -fsS http://localhost:8081/ | grep -qi '<html'

          # Sauberes Herunterfahren über SIGTERM (tini) prüfen.
          docker stop -t 20 comfobox-ci
          docker logs comfobox-ci 2>&1 | grep -q "Application is shutting down"
          echo "Shutdown über SIGTERM: OK"

          docker rm -f comfobox-ci