name: docker-publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image-Tag (z. B. 1.1.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish comfobox-gateway
    runs-on: ubuntu-latest
    # Die Version wird an den Release-Job weitergegeben - dort ist
    # `steps.version` **nicht** verfügbar (die Steps belong zum eigenen Job).
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Login (GHCR)
      #
      # **Wichtig:** Ein Paket, das mit dem `GITHUB_TOKEN` publiziert wurde,
      # kann **nicht** auf "public" umgestellt werden ("You can't change the
      # visibility of packages that were published using GITHUB_TOKEN").
      # Ohne ein öffentliches Paket kann aber weder die Synology noch der
      # HA-Supervisor das Image ziehen.
      #
      # Deshalb wird - falls vorhanden - ein **Personal Access Token**
      # (`secrets.GHCR_TOKEN`, classic, mit `write:packages` und
      # `read:packages`) verwendet. Nur damit ist das Paket später auf
      # "public" umstellbar. Ohne das Secret greift der `GITHUB_TOKEN`.
      - name: Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Die Sichtbarkeit des Pakets **prüfen**.
      #
      # Für Pakete im **Nutzer-Namespace** gibt es keinen API-Endpunkt zum
      # Ändern der Sichtbarkeit (`PATCH /user/packages/...` → 404, es
      # existiert nur für Organisationen). Geprüft wird deshalb nur, und
      # bei "private" wird mit dem exakten Weg gewarnt.
      #
      # Ein Paket, das mit dem `GITHUB_TOKEN` publiziert wurde, lässt sich
      # **gar nicht** auf "public" umstellen ("You can't change the
      # visibility of packages that were published using GITHUB_TOKEN").
      # Dafür muss das Paket gelöscht und mit einem **PAT** neu publiziert
      # werden - deshalb wird das Secret `GHCR_TOKEN` verwendet, falls
      # vorhanden.
      - name: Sichtbarkeit des Pakets prüfen
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE: comfobox-gateway
        run: |
          set +e
          set -uo pipefail
          echo "::group::Sichtbarkeit des Pakets"
          visibility=$(gh api "/user/packages/container/${PACKAGE}" \
            --jq '.visibility' 2>/dev/null)
          echo "::endgroup::"

          case "$visibility" in
            public)
              echo "Das Paket ist öffentlich - der Synology- und der HA-Supervisor können das Image ziehen."
              ;;
            private)
              echo "::warning::Das Paket '${PACKAGE}' ist PRIVAT. Ohne öffentliches Paket kann der Synology- und der HA-Supervisor das Image nicht ziehen (HTTP 401)."
              echo "::warning::Sichtbarkeit umstellen: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/settings -> 'Change visibility' -> 'Public'"
              echo "::warning::Lässt sich das nicht umstellen, wurde das Paket mit dem GITHUB_TOKEN publiziert. Dann: Paket löschen, Secret 'GHCR_TOKEN' (PAT classic mit write:packages + read:packages) hinterlegen und den Tag neu pushen."
              ;;
            *)
              echo "::warning::Die Sichtbarkeit konnte nicht gelesen werden (Token fehlt oder unzureichend). Bitte manuell prüfen: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/settings"
              ;;
          esac
          exit 0

      # Der Name des Repositorys muss **kleingeschrieben** sein - Docker
      # lehnt "ghcr.io/RF77/..." mit "repository name must be lowercase" ab.
      - name: Namespace (lower case)
        id: namespace
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Die Version **ohne** "v" - das HA-Add-on zieht das Image mit genau
      # diesem Tag (sonst findet der Supervisor das Image nicht).
      - name: Version ermitteln
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/comfobox-gateway
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }}
            # `latest` nur aus dem Default-Branch (`master`). Der Branch
            # `main` existiert in diesem Repository nicht - die Bedingung
            # war damit immer falsch.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long

      # Ein Image für Gateway UND Web-Oberfläche (→ ADR-007).
      # Der Kontext ist das Repository-Wurzelverzeichnis, weil das Image
      # sowohl das .NET-Projekt als auch die Angular-Oberfläche braucht.
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ComfoBox.Gateway/Dockerfile
          push: true
          # Multi-Arch ist Pflicht: das HA-Add-on laeuft auf Raspberry Pi 5
          # (arm64), das Synology-Paket auf x86_64.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # Der Scan laeuft VOR dem Push-Erfolg: ein Image mit CRITICAL/HIGH darf
      # nicht in der Registry landen (exit-code '1' bricht den Job ab).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/comfobox-gateway:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Der **entscheidende** Test: laesst sich das Image **ohne jede
      # Anmeldung** ziehen? Genau das tun die Synology und der
      # HA-Supervisor - nur so bekommen sie das Image ueberhaupt.
      #
      # Die API-Sichtbarkeit ("public") allein beweist es nicht, und
      # umgekehrt ist ein Manifest-Abruf **ohne** Token **immer** 401 - auch
      # bei oeffentlichen Images, weil die Registry zwingend einen
      # Bearer-Token verlangt. Geprueft wird deshalb der Abruf mit einem
      # **anonymen** Pull-Token.
      #
      # GHCR braucht nach dem Push manchmal einen Moment, bis das Manifest
      # ueber den Pull-Endpoint erreichbar ist - deshalb mehrfach versuchen.
      - name: Anonymen Pull pruefen
        env:
          PACKAGE: rf77/comfobox-gateway
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          set -uo pipefail
          echo "::group::Anonymer Pull (ohne Anmeldung)"
          code=""
          for i in 1 2 3 4 5 6; do
            token=$(curl -s "https://ghcr.io/token?scope=repository:${PACKAGE}:pull&service=ghcr.io" \
              | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${PACKAGE}/manifests/${VERSION}")
            echo "Versuch ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          echo "::endgroup::"

          if [ "$code" = "200" ]; then
            echo "Das Image ist anonym ziehbar - NAS und HA-Supervisor koennen es ohne Anmeldung holen."
          else
            echo "::error::Das Image ist NICHT anonym ziehbar (HTTP ${code}). NAS und HA-Supervisor koennen es dann nicht ziehen."
            echo "::error::Ursache: Das Paket ist privat - oder es wurde mit dem automatischen GITHUB_TOKEN publiziert (dann laesst sich 'Change visibility' nicht anwenden)."
            echo "::error::Loesung: Paket loeschen, Secret 'GHCR_TOKEN' (PAT classic mit write:packages + read:packages) hinterlegen und den Tag neu pushen."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Das Synology-Paket (.spk) wird von .github/workflows/synology-spk.yml
  # gebaut und als Release-Asset veröffentlicht. Es läuft dort eigenständig,
  # damit das Paket auch OHNE Image-Publish erzeugt werden kann
  # (workflow_dispatch) und die Release-Notizen nicht doppelt gepflegt
  # werden müssen.
  # ─────────────────────────────────────────────────────────────────────────

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release-Notizen schreiben
        run: |
          # Die Notizen gehen in eine **Datei**, nicht in `$GITHUB_OUTPUT`:
          # mehrzeilige Werte brauchen dort das Delimiter-Schema
          # (`key<<EOF`), und einzelne `echo`-Zeilen ohne `=` ergeben
          # "Invalid format '## Images'" - der Release-Notizen-Schritt
          # scheiterte daran. Mit `body_path` uebergibt softprops die Datei
          # direkt - unkompliziert und robust.
          #
          # Die Version kommt aus `needs.publish.outputs.version` -
          # `steps.version` gehoert zum Job `publish` und ist hier leer.
          #
          # `echo` mit einfachen Anfuehrungszeichen: die Backticks der
          # Code-Fences und der-inline-Auszeichnung bleiben literal (in
          # doppelten Anfuehrungszeichen waeren sie eine Command-Substitution).
          set -euo pipefail
          {
            echo '## Images'
            echo ''
            echo '```'
            echo "${{ env.REGISTRY }}/rf77/comfobox-gateway:${{ needs.publish.outputs.version }}"
            echo '```'
            echo ''
            echo 'Multi-Arch: linux/amd64, linux/arm64'
            echo ''
            echo '## Synology-Paket'
            echo '```'
            echo "ComfoBoxGateway_noarch-dsm7_${{ needs.publish.outputs.version }}-0001.spk"
            echo '```'
            echo ''
            echo 'Installation: DSM - Paketcenter - Installieren - Manuelle Installation.'
            echo ''
            echo '## Home Assistant'
            echo ''
            echo '- Integration (HACS): `custom_components/comfobox`'
            echo '- Add-on: `comfobox` (Port 8099)'
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            CHANGELOG.md
