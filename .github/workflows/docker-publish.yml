name: docker-publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image-Tag (z. B. 1.1.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish comfobox-gateway
    runs-on: ubuntu-latest
    # Die Version wird an den Release-Job weitergegeben - dort ist
    # `steps.version` **nicht** verfügbar (die Steps belong zum eigenen Job).
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Der Name des Repositorys muss **kleingeschrieben** sein - Docker
      # lehnt "ghcr.io/RF77/..." mit "repository name must be lowercase" ab.
      - name: Namespace (lower case)
        id: namespace
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Die Version **ohne** "v" - das HA-Add-on zieht das Image mit genau
      # diesem Tag (sonst findet der Supervisor das Image nicht).
      - name: Version ermitteln
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/comfobox-gateway
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }}
            # `latest` nur aus dem Default-Branch (`master`). Der Branch
            # `main` existiert in diesem Repository nicht - die Bedingung
            # war damit immer falsch.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long

      # Ein Image für Gateway UND Web-Oberfläche (→ ADR-007).
      # Der Kontext ist das Repository-Wurzelverzeichnis, weil das Image
      # sowohl das .NET-Projekt als auch die Angular-Oberfläche braucht.
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ComfoBox.Gateway/Dockerfile
          push: true
          # Multi-Arch ist Pflicht: das HA-Add-on laeuft auf Raspberry Pi 5
          # (arm64), das Synology-Paket auf x86_64.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # Der Scan laeuft VOR dem Push-Erfolg: ein Image mit CRITICAL/HIGH darf
      # nicht in der Registry landen (exit-code '1' bricht den Job ab).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/comfobox-gateway:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # ─────────────────────────────────────────────────────────────────────────
  # Das Synology-Paket (.spk) wird von .github/workflows/synology-spk.yml
  # gebaut und als Release-Asset veröffentlicht. Es läuft dort eigenständig,
  # damit das Paket auch OHNE Image-Publish erzeugt werden kann
  # (workflow_dispatch) und die Release-Notizen nicht doppelt gepflegt
  # werden müssen.
  # ─────────────────────────────────────────────────────────────────────────

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release-Notizen schreiben
        run: |
          # Die Notizen gehen in eine **Datei**, nicht in `$GITHUB_OUTPUT`:
          # mehrzeilige Werte brauchen dort das Delimiter-Schema
          # (`key<<EOF`), und einzelne `echo`-Zeilen ohne `=` ergeben
          # "Invalid format '## Images'" - der Release-Notizen-Schritt
          # scheiterte daran. Mit `body_path` uebergibt softprops die Datei
          # direkt - unkompliziert und robust.
          #
          # Die Version kommt aus `needs.publish.outputs.version` -
          # `steps.version` gehoert zum Job `publish` und ist hier leer.
          #
          # `echo` mit einfachen Anfuehrungszeichen: die Backticks der
          # Code-Fences und der-inline-Auszeichnung bleiben literal (in
          # doppelten Anfuehrungszeichen waeren sie eine Command-Substitution).
          set -euo pipefail
          {
            echo '## Images'
            echo ''
            echo '```'
            echo "${{ env.REGISTRY }}/rf77/comfobox-gateway:${{ needs.publish.outputs.version }}"
            echo '```'
            echo ''
            echo 'Multi-Arch: linux/amd64, linux/arm64'
            echo ''
            echo '## Synology-Paket'
            echo '```'
            echo "ComfoBoxGateway_noarch-dsm7_${{ needs.publish.outputs.version }}-0001.spk"
            echo '```'
            echo ''
            echo 'Installation: DSM - Paketcenter - Installieren - Manuelle Installation.'
            echo ''
            echo '## Home Assistant'
            echo ''
            echo '- Integration (HACS): `custom_components/comfobox`'
            echo '- Add-on: `comfobox` (Port 8099)'
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            CHANGELOG.md
