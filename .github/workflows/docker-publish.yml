name: docker-publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image-Tag (z. B. 1.1.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish comfobox-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Der Name des Repositorys muss **kleingeschrieben** sein - Docker
      # lehnt "ghcr.io/RF77/..." mit "repository name must be lowercase" ab.
      - name: Namespace (lower case)
        id: namespace
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Die Version **ohne** "v" - das HA-Add-on zieht das Image mit genau
      # diesem Tag (sonst findet der Supervisor das Image nicht).
      - name: Version ermitteln
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/comfobox-gateway
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/main') }}
            type=sha,format=long

      # Ein Image für Gateway UND Web-Oberfläche (→ ADR-007).
      # Der Kontext ist das Repository-Wurzelverzeichnis, weil das Image
      # sowohl das .NET-Projekt als auch die Angular-Oberfläche braucht.
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ComfoBox.Gateway/Dockerfile
          push: true
          # Multi-Arch ist Pflicht: das HA-Add-on laeuft auf Raspberry Pi 5
          # (arm64), das Synology-Paket auf x86_64.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # Der Scan laeuft VOR dem Push-Erfolg: ein Image mit CRITICAL/HIGH darf
      # nicht in der Registry landen (exit-code '1' bricht den Job ab).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/comfobox-gateway:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  spk:
    name: Synology-Paket (SPK)
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Die Version aus dem Tag: "v1.2.3" → 1.2.3
      - name: Version ermitteln
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=0001" >> "$GITHUB_OUTPUT"

      # Syntaxprüfung aller Shell-Skripte + Test des JSON-Parsers.
      - name: Shell-Skripte prüfen
        run: bash deploy/synology-spk/tools/check-shell.sh

      - name: SPK bauen
        run: bash deploy/synology-spk/build-spk.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.revision }}"

      # Die Paketquelle des DSM ("Paketcenter → Einstellungen → Paketquelle")
      # zeigt auf diese Datei. Ohne sie findet der Nutzer kein Update.
      - name: Paketquelle schreiben
        run: |
          cd deploy/synology-spk
          VERSION="${{ steps.version.outputs.version }}"
          REVISION="${{ steps.version.outputs.revision }}"
          SPK="ComfoBoxGateway_noarch-dsm7_${VERSION}-${REVISION}.spk"
          CHECKSUM=$(md5sum "dist/$SPK" | cut -d' ' -f1)
          cat > dist/packages.json <<EOF
          {
            "name": "ComfoBox Gateway",
            "description": "MQTT-Gateway für die Zehnder ComfoBox Series 5 mit Web-Oberfläche",
            "maintainer": "RF77",
            "maintainer_url": "https://github.com/${{ github.repository }}",
            "distributor": "RF77",
            "distributor_url": "https://github.com/${{ github.repository }}",
            "support_url": "https://github.com/${{ github.repository }}/issues",
            "packages": [
              {
                "arch": "noarch",
                "version": "${VERSION}-${REVISION}",
                "url": "https://github.com/${{ github.repository }}/releases/latest/download/${SPK}",
                "checksum": "${CHECKSUM}"
              }
            ]
          }
          EOF
          cat dist/packages.json

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: spk
          path: |
            deploy/synology-spk/dist/*.spk
            deploy/synology-spk/dist/packages.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [publish, spk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Das Synology-Paket gehört ins Release - so kann es das DSM-Paketcenter
      # als "Manuelle Installation" herunterladen.
      - name: SPK herunterladen
        uses: actions/download-artifact@v4
        with:
          name: spk
          path: dist

      - name: Extract release notes
        id: notes
        run: |
          {
            echo '## Images'
            echo '```'
            echo "${{ env.REGISTRY }}/rf77/comfobox-gateway:${{ steps.version.outputs.version }}"
            echo '```'
            echo ''
            echo 'Multi-Arch: linux/amd64, linux/arm64'
            echo ''
            echo '## Synology-Paket'
            echo '```'
            echo 'ComfoBoxGateway_noarch-dsm7_${{ steps.version.outputs.version }}-0001.spk'
            echo '```'
            echo ''
            echo 'Installation: DSM → Paketcenter → Installieren → Manuelle Installation.'
            echo ''
            echo '## Home Assistant'
            echo ''
            echo '- Integration (HACS): `custom_components/comfobox`'
            echo '- Add-on: `comfobox` (Port 8099)'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.notes }}
          files: |
            CHANGELOG.md
            dist/*.spk
            dist/packages.json
