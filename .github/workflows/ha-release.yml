name: ha-release

# ─────────────────────────────────────────────────────────────────────────────
# Release des Home-Assistant-Ökosystems:
#
#   * HACS-Integration  → GitHub-Release mit dem Tag = Version aus
#                          custom_components/comfobox/manifest.json
#   * HA-Add-on         → GitHub-Release mit dem Tag = Version aus
#                          deploy/ha-addon/comfobox/config.yaml
#
# HACS findet eine Custom-Integration über die **Releases** des Repositories:
# der Tag des Releases muss exakt der Version in der manifest.json entsprechen
# (HACS lädt die Dateien über den Tag-Namen herunter). Deshalb wird hier ein
# Release **ohne** "v" erzeugt - der Auslöser ist der Tag "v<version>".
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Versionen prüfen (Tag, Integration, Add-on, SPK, Gateway)
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.version.outputs.integration }}
      addon: ${{ steps.version.outputs.addon }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Versionen ermitteln und vergleichen
        id: version
        run: |
          set -euo pipefail

          # Kein `jq`: die Datei hat genau ein `"version"`-Feld, und grep/sed
          # sind auf jedem Läufer und in der Git-Bash vorhanden.
          INTEGRATION=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' \
            custom_components/comfobox/manifest.json | head -1 \
            | sed -E 's/.*"([^"]*)"$/\1/')
          ADDON=$(grep -E '^version:' deploy/ha-addon/comfobox/config.yaml \
            | head -1 | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          IMAGE=$(grep -E '^image:' deploy/ha-addon/comfobox/config.yaml \
            | head -1 | sed -E 's/^image:[[:space:]]*"([^"]*)".*$/\1/')
          SPK=$(tr -d '[:space:]' < deploy/synology-spk/src/VERSION)
          GATEWAY=$(grep -oE '<Version>[^<]+</Version>' src/Directory.Build.props \
            | head -1 | sed -E 's#</?Version>##g')

          echo "Integration (manifest.json)    : ${INTEGRATION}"
          echo "Add-on      (config.yaml)     : ${ADDON}"
          echo "Image       (config.yaml)     : ${IMAGE}"
          echo "SPK         (src/VERSION)     : ${SPK}"
          echo "Gateway     (Build.props)     : ${GATEWAY}"

          if [ -z "${INTEGRATION}" ] || [ -z "${ADDON}" ] \
            || [ -z "${SPK}" ] || [ -z "${GATEWAY}" ]; then
            echo "::error::Die Versionen konnten nicht gelesen werden."
            exit 1
          fi

          # Der Auslöser ist der Tag "v<version>" - der Workflow-Dispatch nutzt
          # die Version direkt.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ inputs.version }}"
          else
            EXPECTED="${GITHUB_REF_NAME#v}"
          fi

          # **Ein** Tag löst **alle** Release-Workflows aus. Weicht eine der
          # fünf Stellen ab, entsteht ein Paket mit der falschen Version:
          #
          #   * Integration  → HACS findet den Tag nicht (Release-Tag = version)
          #   * Add-on       → der Supervisor findet das Image nicht
          #   * SPK          → das Paketcenter weist das Paket ab
          #   * Gateway      → `ComfoBox/Version` meldet eine falsche Version
          #     (so meldete das Image :1.0.3 die Version 1.0.1)
          #
          # Deshalb bricht der Lauf bei der **ersten** Abweichung ab - erst
          # nachdem alle fünf Werte im Log stehen.
          FAILED=0

          check() {
            if [ "${EXPECTED}" != "$2" ]; then
              echo "::error::Der Tag (${EXPECTED}) passt nicht zu $1 (${2:-leer})."
              FAILED=1
            fi
          }

          check "der Integration (manifest.json)" "${INTEGRATION}"
          check "dem Add-on (config.yaml)" "${ADDON}"
          check "der SPK (deploy/synology-spk/src/VERSION)" "${SPK}"
          check "dem Gateway (src/Directory.Build.props)" "${GATEWAY}"

          # Der Supervisor zieht das Image mit dem Versions-Tag - ohne ihn
          # findet er das Image nicht.
          case "${IMAGE}" in
            *":${ADDON}") ;;
            *)
              echo "::error::Das Image (${IMAGE}) traegt nicht den Versions-Tag des Add-ons (:${ADDON})."
              FAILED=1
              ;;
          esac

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::Bitte alle fuenf Stellen auf ${EXPECTED} setzen und den Tag neu setzen."
            exit 1
          fi

          echo "integration=${INTEGRATION}" >> "$GITHUB_OUTPUT"
          echo "addon=${ADDON}" >> "$GITHUB_OUTPUT"

      # Die HACS-Prüfung meldet u. a. "The repository has no valid topics".
      # Die Topics sind eine **Einstellung des Repositorys** (GitHub-Seite
      # → Topics), nicht Teil des Codes - sie lassen sich hier nicht setzen.
      #
      # Für die Installation aus einem **eigenen** HACS-Repository sind die
      # Topics nicht nötig; sie werden nur für die Veröffentlichung im
      # HACS-Default-Repository geprüft. Deshalb blockiert die Prüfung das
      # Release nicht (continue-on-error), der Fehler bleibt aber sichtbar.
      #
      # Nötige Topics (Repository-Einstellungen): `hacs` und `integration`
      # (nicht `custom-component` - das ist die alte Schreibweise).
      - name: HACS prüfen
        id: hacs
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

      - name: HACS-Hinweis
        if: steps.hacs.outcome == 'failure'
        run: |
          echo "::warning::Die HACS-Prüfung ist fehlgeschlagen. Typischer Grund: Das Repository hat keine Topics. Unter 'Settings → General → Topics' bitte eintragen: hacs, integration, home-assistant. Für die Installation aus einem eigenen HACS-Repository sind die Topics nicht erforderlich - deshalb blockiert der Fehler das Release nicht."

      - name: Add-on prüfen (hassfest)
        uses: home-assistant/actions/hassfest@master
        with:
          # Der Input `config-file` existiert bei dieser Action **nicht**
          # ("Unexpected input(s) 'config-file', valid inputs are ['']") -
          # die Action prüft das Add-on im Repository-Standardpfad.
          path: deploy/ha-addon/comfobox

  release:
    name: HACS- und Add-on-Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Das Archiv enthält die Dateien des Add-ons - der Supervisor lädt es
      # aus dem Release, wenn der Nutzer eine bestimmte Version installiert.
      - name: Add-on-Archiv bauen
        run: |
          set -euo pipefail

          cd deploy/ha-addon/comfobox
          tar czf "comfobox-${{ needs.validate.outputs.addon }}.tar.gz" \
            config.yaml DOCS.md CHANGELOG.md translations

      - name: Release-Notizen schreiben
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## Home-Assistant-Integration

          \`custom_components/comfobox\` - Version ${{ needs.validate.outputs.integration }}

          Installation: HACS → Integration → ComfoBox → Hinzufügen.
          Adresse und Token werden im Config-Flow abgefragt; das Token erzeugt
          der Nutzer in der Web-Oberfläche des Gateways (Konfiguration → API-Token).

          ## Home-Assistant-Add-on

          \`comfobox\` - Version ${{ needs.validate.outputs.addon }}

          Installation: HACS → Add-on Store → ComfoBox Gateway → Installieren.
          Das Add-on nutzt dasselbe Image wie Docker und Synology-Paket.

          \`\`\`
          ghcr.io/rf77/comfobox-gateway:${{ needs.validate.outputs.addon }}
          \`\`\`

          Multi-Arch: linux/amd64, linux/arm64 (Raspberry Pi 4/5, HA Green).
          EOF

      # Ein **eines** Release für beide Artefakte.
      #
      # Integration und Add-on haben dieselbe Version (`1.0.0`) und liegen im
      # selben Repository - zwei Releases mit demselben Tag sind unmöglich
      # (der zweite Aufruf würde das erste überschreiben und die
      # Add-on-Notizen würden die Integrations-Notizen ersetzen).
      #
      # HACS findet die Integration über den Release-Tag = Version aus der
      # manifest.json; der HA-Supervisor findet das Add-on-Archiv über den
      # Release mit der Add-on-Version. Beides ist dieselbe Version → also
      # **ein** Release mit **beiden** Assets.
      - name: Release (HACS-Integration + Add-on)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.integration }}
          target_commitish: ${{ github.sha }}
          name: ComfoBox ${{ needs.validate.outputs.integration }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            CHANGELOG.md
            deploy/ha-addon/comfobox/comfobox-*.tar.gz
