version: 2

updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, dotnet]

  - package-ecosystem: npm
    directory: /src/ComfoBox.Web
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, angular]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /src/ComfoBox.Gateway
    schedule:
      interval: monthly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /src/ComfoBox.Web
    schedule:
      interval: monthly
    labels: [dependencies, docker]
